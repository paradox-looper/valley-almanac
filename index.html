<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0C120D" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Valley Almanac — Bloomburrow Standard</title>
<link rel="preconnect" href="https://api.scryfall.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0C120D; --surface:#141C15; --raised:#1B2620; --line:#243029;
    --text:#EAE3D2; --muted:#8B967F; --amber:#E8A94B; --amber-dim:#9C7434;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    min-height:100vh; color:var(--text);
    background:radial-gradient(120% 50% at 50% -5%, rgba(232,169,75,.07), transparent 60%), var(--bg);
    font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .wrap{max-width:460px; margin:0 auto; padding:0 16px;}
  header{padding:26px 2px 14px; text-align:center;}
  .eyebrow{font-size:11px; letter-spacing:.22em; color:var(--amber); text-transform:uppercase; font-weight:600;}
  h1{font-family:'Cormorant Garamond', Georgia, serif; font-size:34px; font-weight:700; margin:4px 0 2px; letter-spacing:.01em;}
  .tagline{font-size:13px; color:var(--muted);}

  .tiers{display:grid; grid-template-columns:1fr 1fr 1fr; background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:4px; gap:4px;}
  .tiers button{min-height:46px; border-radius:9px; border:none; cursor:pointer; background:transparent; color:var(--muted); transition:background .15s;}
  .tiers button.on{background:var(--raised); box-shadow:inset 0 0 0 1px var(--amber-dim); color:var(--text);}
  .tiers .t-label{font-size:15px; font-weight:700;}
  .tiers .t-sub{font-size:10.5px; color:var(--muted);}
  .tiers button.on .t-sub{color:var(--amber);}

  .chips{display:flex; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding:14px 2px 4px; scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chips button{flex-shrink:0; display:flex; align-items:center; gap:7px; min-height:40px; padding:0 14px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--muted); font-size:13.5px; font-weight:600; cursor:pointer; font-family:inherit;}
  .chips button.on{border-color:var(--amber-dim); background:var(--raised); color:var(--text);}

  .deck{margin-top:12px; background:var(--surface); border:1px solid var(--line); border-radius:18px; overflow:hidden;}
  .ribbon{height:4px;}
  .deck-head{padding:18px 18px 6px;}
  .deck-title-row{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
  h2{font-family:'Cormorant Garamond', Georgia, serif; font-size:27px; font-weight:700; margin:0; line-height:1.1;}
  .archetype{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--amber); font-weight:600; margin:5px 0 10px;}
  .summary{font-size:14.5px; line-height:1.55; margin:0;}
  .plan{font-size:13px; line-height:1.5; color:var(--muted); margin:10px 0 6px; font-style:italic;}
  .fetch-note{font-size:12px; color:var(--amber-dim); padding:4px 0;}

  .lists{padding:4px 8px 14px;}
  .sec{margin-top:10px;}
  .sec-head{display:flex; justify-content:space-between; padding:0 10px 6px; font-size:11.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:700;}
  .sec-body{background:var(--raised); border-radius:12px; border:1px solid var(--line); overflow:hidden;}
  .row{display:flex; align-items:center; width:100%; gap:10px; min-height:46px; padding:0 12px; background:transparent; border:none; border-top:1px solid var(--line); color:var(--text); cursor:pointer; text-align:left; font-family:inherit;}
  .row:first-child{border-top:none;}
  .row:active{background:rgba(232,169,75,.06);}
  .qty{width:26px; font-size:13px; font-weight:700; color:var(--amber); flex-shrink:0; font-variant-numeric:tabular-nums;}
  .cname{flex:1; font-size:15px; font-weight:500; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .pips{display:inline-flex; gap:3px; flex-shrink:0;}

  .pip{width:17px; height:17px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; box-shadow:inset 0 -1px 1px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.4); line-height:1; user-select:none;}
  .pip.sm{width:14px; height:14px; font-size:8.5px; vertical-align:-2px;}
  .dot{border-radius:50%; box-shadow:0 0 0 1px rgba(0,0,0,.5), inset 0 -1px 1px rgba(0,0,0,.3); display:inline-block;}

  footer{text-align:center; font-size:11.5px; color:var(--muted); padding:18px 10px 30px; line-height:1.6;}

  /* bottom sheet */
  .overlay{position:fixed; inset:0; z-index:50; background:rgba(5,9,6,.78); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); display:flex; align-items:flex-end; justify-content:center; animation:fade .18s ease;}
  .sheet{width:100%; max-width:430px; background:var(--surface); border-radius:20px 20px 0 0; border:1px solid var(--line); border-bottom:none; padding:10px 18px calc(20px + env(safe-area-inset-bottom)); animation:up .24s cubic-bezier(.32,.72,.32,1);}
  .grab{width:38px; height:4px; border-radius:2px; background:var(--line); margin:4px auto 12px;}
  .img-box{border-radius:14px; overflow:hidden; aspect-ratio:488/680; max-height:62vh; margin:0 auto; max-width:330px; display:flex; align-items:center; justify-content:center; background:var(--raised);}
  .img-box img{width:100%; height:100%; object-fit:contain; display:block;}
  .spin{width:26px; height:26px; border-radius:50%; border:2.5px solid var(--line); border-top-color:var(--amber); animation:spin .8s linear infinite; margin:0 auto 10px;}
  .center-note{color:var(--muted); font-size:13px; text-align:center; padding:24px; line-height:1.5;}
  .close-btn{margin-top:16px; width:100%; min-height:46px; border-radius:12px; border:1px solid var(--line); background:var(--raised); color:var(--text); font-size:16px; font-weight:600; cursor:pointer; font-family:inherit;}

  /* rendered-card fallback */
  .rc{width:100%; border-radius:14px; padding:14px; border:2px solid var(--rc, #8E8878); background:linear-gradient(180deg, color-mix(in srgb, var(--rc) 16%, transparent), transparent 90px), var(--raised); box-shadow:0 0 24px color-mix(in srgb, var(--rc) 14%, transparent);}
  .rc-head{display:flex; justify-content:space-between; align-items:center; gap:8px; padding-bottom:8px; border-bottom:1px solid var(--line);}
  .rc-name{font-family:'Cormorant Garamond', Georgia, serif; font-size:19px; font-weight:700; line-height:1.15; min-width:0;}
  .rc-type{font-size:12px; color:var(--muted); padding:7px 0; font-weight:600;}
  .rc-text{background:rgba(0,0,0,.22); border-radius:9px; padding:10px 12px; max-height:34vh; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .rc-text p{margin:0 0 7px; font-size:13.5px; line-height:1.5;}
  .rc-text p:last-child{margin-bottom:0;}
  .rc-flavor{font-style:italic; color:var(--muted); font-size:12.5px !important;}
  .rc-foot{display:flex; justify-content:space-between; align-items:center; padding-top:10px;}
  .rc-rarity{font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:700; color:var(--muted);}
  .rc-rarity.rare{color:var(--amber);} .rc-rarity.mythic{color:#D96E34;}
  .rc-pt{font-size:16px; font-weight:800; padding:2px 10px; border-radius:8px; border:1.5px solid var(--rc, #8E8878); background:rgba(0,0,0,.3); font-variant-numeric:tabular-nums;}

  @keyframes up{from{transform:translateY(40px); opacity:.6} to{transform:none; opacity:1}}
  @keyframes fade{from{opacity:0} to{opacity:1}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }
</style>
</head>

let state = { tier:'mono', deckId:'mono-r' };
const norm = s => s.toLowerCase().trim();
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function storeCard(card, aliasName){
  const face = card.card_faces && card.card_faces[0];
  const pick = k => card[k] || (face && face[k]) || '';
  const entry = {
    cost: pick('mana_cost'),
    type: pick('type_line'),
    oracle: pick('oracle_text'),
    flavor: pick('flavor_text'),
    power: pick('power'), toughness: pick('toughness'), loyalty: pick('loyalty'),
    rarity: card.rarity || '',
    colors: (card.colors && card.colors.length ? card.colors : null) || (face && face.colors) || card.color_identity || [],
    actualName: card.name,
  };
  cache[norm(card.name)] = entry;
  if (card.name.includes(' // ')) cache[norm(card.name.split(' // ')[0])] = entry;
  if (aliasName) cache[norm(aliasName)] = entry;
}

async function loadDeckData(deck){
  const names = deck.sections.flatMap(s => s.cards.map(c => c[1]));
  const need = [...new Set(names)].filter(n => !cache[norm(n)]);
  if (!need.length) return;
  document.getElementById('fetchNote') && (document.getElementById('fetchNote').style.display = 'block');
  try {
    for (let i = 0; i < need.length; i += 70){
      const chunk = need.slice(i, i + 70);
      const res = await fetch('https://api.scryfall.com/cards/collection', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ identifiers: chunk.map(name => ({name})) }),
      });
      const json = await res.json();
      (json.data || []).forEach(c => storeCard(c));
      for (const nf of (json.not_found || [])){
        try {
          const r = await fetch('https://api.scryfall.com/cards/named?fuzzy=' + encodeURIComponent(nf.name));
          if (r.ok) storeCard(await r.json(), nf.name);
        } catch(e){}
      }
    }
  } catch(e){ /* offline — names render without pips */ }
  renderDeck(); // refresh pips
}

/* ───────────────────────── rendering ───────────────────────── */
function pipHTML(sym, small){
  const cls = 'pip' + (small ? ' sm' : '');
  if (sym === 'T') return `<span class="${cls}" style="background:${PIP.C.bg};color:${PIP.C.fg}">↷</span>`;
  if (sym.includes('/')){
    const [a,b] = sym.split('/');
    const pa = PIP[a] || PIP.C, pb = PIP[b] || PIP.C;
    return `<span class="${cls}" style="background:linear-gradient(135deg, ${pa.bg} 50%, ${pb.bg} 50%);color:#1d1c16;font-size:${small?7:8}px">${esc(sym.replace('/',''))}</span>`;
  }
  const colored = PIP[sym] && isNaN(sym);
  const p = colored ? PIP[sym] : PIP.C;
  return `<span class="${cls}" style="background:${p.bg};color:${p.fg}">${esc(sym)}</span>`;
}
function costHTML(cost, small){
  if (!cost) return '';
  const syms = [...cost.matchAll(/\{([^}]+)\}/g)].map(m => m[1]);
  return `<span class="pips">${syms.map(s => pipHTML(s, small)).join('')}</span>`;
}
function dotsHTML(colors, size){
  return `<span style="display:inline-flex;gap:4px">${colors.map(c =>
    `<span class="dot" style="width:${size}px;height:${size}px;background:${PIP[c].bg}"></span>`).join('')}</span>`;
}
function oracleHTML(text){
  if (!text) return '';
  return text.split('\n').map(line =>
    '<p>' + line.split(/(\{[^}]+\})/g).map(part => {
      const m = part.match(/^\{([^}]+)\}$/);
      return m ? pipHTML(m[1], true) : esc(part);
    }).join('') + '</p>'
  ).join('');
}

function renderTiers(){
  document.getElementById('tiers').innerHTML = TIERS.map(t => `
    <button class="${state.tier === t.key ? 'on' : ''}" data-tier="${t.key}">
      <div class="t-label">${t.label}</div><div class="t-sub">${t.sub}</div>
    </button>`).join('');
}
function renderChips(){
  const tierDecks = DECKS.filter(d => d.tier === state.tier);
  document.getElementById('chips').innerHTML = tierDecks.map(d => `
    <button class="${d.id === state.deckId ? 'on' : ''}" data-deck="${d.id}">
      ${dotsHTML(d.colors, 9)} ${esc(d.name)}
    </button>`).join('');
}
function renderDeck(){
  const deck = DECKS.find(d => d.id === state.deckId);
  const total = deck.sections.reduce((a,s) => a + s.cards.reduce((b,c) => b + c[0], 0), 0);
  const ribbon = deck.colors.length === 1 ? PIP[deck.colors[0]].bg
    : `linear-gradient(90deg, ${deck.colors.map(c => PIP[c].bg).join(', ')})`;
  const anyMissing = deck.sections.some(s => s.cards.some(c => !c[2] && !cache[norm(c[1])]));
  document.getElementById('deck').innerHTML = `
    <div class="ribbon" style="background:${ribbon}"></div>
    <div class="deck-head">
      <div class="deck-title-row"><h2>${esc(deck.name)}</h2>${dotsHTML(deck.colors, 13)}</div>
      <div class="archetype">${esc(deck.archetype)} · ${total} cards</div>
      <p class="summary">${esc(deck.summary)}</p>
      <p class="plan">Game plan: ${esc(deck.plan)}</p>
      <div class="fetch-note" id="fetchNote" style="display:${anyMissing ? 'block' : 'none'}">Fetching mana costs from Scryfall…</div>
    </div>
    <div class="lists">
      ${deck.sections.map(sec => {
        const count = sec.cards.reduce((a,c) => a + c[0], 0);
        return `<div class="sec">
          <div class="sec-head"><span>${esc(sec.title)}</span><span>${count}</span></div>
          <div class="sec-body">
            ${sec.cards.map(c => {
              const data = cache[norm(c[1])];
              return `<button class="row" data-card="${esc(c[1])}">
                <span class="qty">${c[0]}×</span>
                <span class="cname">${esc(c[1])}</span>
                ${!c[2] && data ? costHTML(data.cost) : ''}
              </button>`;
            }).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>`;
}
function renderAll(){ renderTiers(); renderChips(); renderDeck(); loadDeckData(DECKS.find(d => d.id === state.deckId)); }

/* ───────────────────────── card popup ───────────────────────── */
function frameColor(card){
  const cols = (card && card.colors) || [];
  if (cols.length > 1) return FRAME.GOLD;
  if (cols.length === 1) return FRAME[cols[0]] || FRAME.C;
  return FRAME.C;
}
function renderedCardHTML(card, name){
  const frame = frameColor(card);
  const pt = (card.power !== '' && card.toughness !== '') ? `${esc(card.power)}/${esc(card.toughness)}`
    : card.loyalty ? `Loyalty ${esc(card.loyalty)}` : null;
  const rcls = card.rarity === 'mythic' ? 'mythic' : card.rarity === 'rare' ? 'rare' : '';
  return `<div class="rc" style="--rc:${frame}">
    <div class="rc-head">
      <div class="rc-name">${esc(card.actualName || name)}</div>
      ${costHTML(card.cost)}
    </div>
    <div class="rc-type">${esc(card.type)}</div>
    <div class="rc-text">
      ${oracleHTML(card.oracle)}
      ${card.flavor ? `<p class="rc-flavor">${esc(card.flavor)}</p>` : ''}
    </div>
    <div class="rc-foot">
      <span class="rc-rarity ${rcls}">${card.rarity ? esc(card.rarity) + ' · ' : ''}Bloomburrow</span>
      ${pt ? `<span class="rc-pt">${pt}</span>` : ''}
    </div>
  </div>`;
}

async function openCard(name){
  const modal = document.getElementById('modal');
  const imgUrl = 'https://api.scryfall.com/cards/named?fuzzy=' + encodeURIComponent(name) + '&format=image&version=normal';
  modal.innerHTML = `
    <div class="overlay" id="ov">
      <div class="sheet" id="sheetBody">
        <div class="grab"></div>
        <div id="sheetContent">
          <div class="img-box"><div class="center-note"><div class="spin"></div>Consulting the almanac…</div></div>
        </div>
        <button class="close-btn" id="closeBtn">Close</button>
      </div>
    </div>`;
  document.body.style.overflow = 'hidden';
  const close = () => { modal.innerHTML = ''; document.body.style.overflow = ''; };
  document.getElementById('ov').addEventListener('click', close);
  document.getElementById('sheetBody').addEventListener('click', e => e.stopPropagation());
  document.getElementById('closeBtn').addEventListener('click', close);

  // ensure full card data for the fallback view
  let data = cache[norm(name)];
  if (!data){
    try {
      const r = await fetch('https://api.scryfall.com/cards/named?fuzzy=' + encodeURIComponent(name));
      if (r.ok){ const json = await r.json(); storeCard(json, name); data = cache[norm(name)]; }
    } catch(e){}
  }

  const content = document.getElementById('sheetContent');
  if (!content) return; // closed before load finished

  const img = new Image();
  img.alt = name;
  img.onload = () => {
    const c = document.getElementById('sheetContent');
    if (!c) return;
    c.innerHTML = '<div class="img-box"></div>';
    c.querySelector('.img-box').appendChild(img);
  };
  img.onerror = () => {
    const c = document.getElementById('sheetContent');
    if (!c) return;
    c.innerHTML = data ? renderedCardHTML(data, name)
      : '<div class="center-note" style="min-height:180px;display:flex;align-items:center;justify-content:center">Couldn\u2019t reach the card archives.<br/>Check your connection and tap the card again.</div>';
  };
  img.src = imgUrl;
}

/* ───────────────────────── events ───────────────────────── */
document.addEventListener('click', e => {
  const tierBtn = e.target.closest('[data-tier]');
  if (tierBtn){
    state.tier = tierBtn.dataset.tier;
    state.deckId = DECKS.find(d => d.tier === state.tier).id;
    renderAll(); return;
  }
  const deckBtn = e.target.closest('[data-deck]');
  if (deckBtn){ state.deckId = deckBtn.dataset.deck; renderChips(); renderDeck(); loadDeckData(DECKS.find(d => d.id === state.deckId)); return; }
  const cardBtn = e.target.closest('[data-card]');
  if (cardBtn){ openCard(cardBtn.dataset.card); }
});

renderAll();
</script>
